site_name: DUT 未来技术学院生存指南
site_description: 一份由学生共同维护的、非官方的未来技术学院成长指南
site_author: DUT Future Guide Contributors
site_url: https://dut-future-guide.github.io/

repo_name: dut-future-guide/dut-future-guide.github.io
repo_url: https://github.com/dut-future-guide/dut-future-guide.github.io
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  icon:
    logo: material/school

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 首页: index.md

  - 开始之前:
      - 序言: preface/index1.md
      - 阅读说明与免责声明: preface/disclaimer.md
      - 什么是大学: core/university.md
      - 大学生存方法论: core/survival-methodology.md
      - 未来学院意味着什么: core/future-school.md

  - AI 成长主线:
      - 总览: ai-roadmap/index.md
      - 基础工具箱: ai-roadmap/tools.md
      - AI 学习基础路线: ai-roadmap/ai-basic-roadmap.md
      - 如何选择 AI 方向: ai-roadmap/choose-direction.md
      - LLM: ai-roadmap/llm.md
      - CV: ai-roadmap/cv.md
      - 机器人与具身智能: ai-roadmap/embodied-ai.md
      - AI for Science: ai-roadmap/ai4science.md

  - 未院生存路径:
      - 课程学习:
          - 总览: future-school-path/courses/index.md
          - 大一课程: future-school-path/courses/freshman.md
          - 大二课程: future-school-path/courses/sophomore.md
      - 科研入门: future-school-path/research.md
      - 竞赛选择:
          - 竞赛作用是什么: future-school-path/competitions/role.md
          - ICPC / 算法竞赛: future-school-path/competitions/icpc.md
          - RoboMaster: future-school-path/competitions/robomaster.md
          - RoboCup 与其他机器人竞赛: future-school-path/competitions/robocup-robotics.md
          - 挑战杯、互联网+: future-school-path/competitions/challenge-cup-internet-plus.md
          - 其他竞赛: future-school-path/competitions/other-competitions.md

  - 升学:
      - 升学认知: future-school-path/graduate-school/know-how.md
      - 保研流程: future-school-path/graduate-school/recommendation-process.md
      - 留学申请:
          - 总览: future-school-path/graduate-school/application-process.md
          - 项目、费用、认证与身份: future-school-path/graduate-school/application-process/projects-costs-and-risk.md
          - 材料、时间线与 Offer: future-school-path/graduate-school/application-process/materials-timeline-and-offers.md
      - 往届去向: future-school-path/graduate-school/alumni-destinations.md

  - 学长学姐路线:
      - 总览: stories/index.md
      - 涂章正: stories/tuzhnagzheng.md
      - 刘博文: stories/liubowen.md
      - 赵建斌: stories/zhaojianbin.md
      - 幸子杰: stories/xingzijie.md
      - recynie: stories/recynie.md
      - 投稿模板: stories/story-template.md

  - 贡献:
      - 贡献者与参与方式: appendix/contribution.md
